spring.application.name=question-service
server.port=8083

# --- Validation Service (comunicacion sincrona REST) ---
saberpro.validation.base-url=http://localhost:8082

# --- H2 (en memoria) ---
spring.datasource.url=jdbc:h2:mem:questiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# falla rapido si el broker no esta disponible (por defecto serian 60 s)
spring.rabbitmq.connection-timeout=5000
