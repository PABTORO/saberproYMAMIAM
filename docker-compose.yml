services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: saberpro-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Consola de administracion
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
